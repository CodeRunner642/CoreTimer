name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect available npm scripts
        id: scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const scripts = pkg.scripts || {};

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_lint=${Boolean(scripts.lint)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_test=${Boolean(scripts.test)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_build=${Boolean(scripts.build)}\n`);
          NODE

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test

      - name: Run build
        if: steps.scripts.outputs.has_build == 'true'
        run: npm run build
